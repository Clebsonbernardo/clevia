<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="16" y="16" width="480" height="240" rx="112" fill="#ffffff" opacity="0.06"/>

  <!-- Decorative orbit ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#7dd3fc" stroke-width="2.5" opacity="0.25" stroke-dasharray="6 10"/>

  <!-- Main gear (stylized C) -->
  <g filter="url(#glow)">
    <path d="M340 150c-26-22-57-33-90-29-34 4-64 22-84 50-20 28-26 62-18 95 8 33 28 60 57 76 29 16 64 18 95 8"
          fill="none" stroke="url(#gear)" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- Gear teeth accents -->
  <circle cx="340" cy="150" r="16" fill="url(#gear)"/>
  <circle cx="300" cy="342" r="13" fill="#38bdf8"/>
  <circle cx="178" cy="350" r="10" fill="#7dd3fc" opacity="0.8"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Wave/wrench accent (maintenance theme) -->
  <g transform="translate(256,256) rotate(-20)">
    <path d="M-40 60 Q-20 40 0 50 Q20 60 40 40"
          fill="none" stroke="url(#wave)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Sparkle accents -->
  <g fill="#fbbf24" opacity="0.9">
    <path d="M400 200 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z"/>
    <path d="M120 300 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" opacity="0.7"/>
  </g>
</svg>
